[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-leaf-disease-cnn"
version = "0.1.0"
description = "PlantVillage CNN architecture comparison and evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
