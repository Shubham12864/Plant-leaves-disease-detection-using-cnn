[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-leaf-disease-cnn"
version = "0.1.0"
description = "PlantVillage CNN architecture comparison and evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

# Ranges above are the supported minimums. The exact versions the results were
# produced with are pinned in requirements.lock; install from that to reproduce.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
extend-exclude = ["kaggle_upload", "data", "checkpoints", ".venv-smoke"]

[tool.ruff.lint]
# Correctness only (syntax errors, undefined names, unused imports/variables).
select = ["E9", "F"]
